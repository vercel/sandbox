name: Publish

on:
  push:
    branches:
      - main
      - drives-beta
  pull_request:

env:
  TURBO_TOKEN: ${{ secrets.TURBOREPO_REMOTE_CACHING_TOKEN }}
  TURBO_TEAM: vercel

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: "pnpm"

      - run: pnpm install
        shell: bash

      - name: Build Monorepo
        run: pnpm run build

      - name: Run tests
        run: pnpm test

      - name: Verify beta pre-release mode
        if: github.ref == 'refs/heads/drives-beta'
        run: |
          if [ ! -f .changeset/pre.json ]; then
            echo "ERROR: .changeset/pre.json not found. drives-beta must be in changeset pre-release mode."
            exit 1
          fi
          TAG=$(jq -r '.tag' .changeset/pre.json)
          if [ "$TAG" != "beta" ]; then
            echo "ERROR: Expected pre-release tag 'beta', got '$TAG'."
            exit 1
          fi
          echo "Verified: changeset pre-release mode is active with tag 'beta'."

      - name: Create Release Pull Request
        uses: changesets/action@v1
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/drives-beta'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: pnpm version:prepare
          publish: pnpm release
          commitMode: github-api
