name: Publish

on:
  push:
    branches:
      - main
      # Release branches for earlier majors, such as 4.x.
      - "[0-9]+.x"
  pull_request:

env:
  TURBO_TOKEN: ${{ secrets.TURBOREPO_REMOTE_CACHING_TOKEN }}
  TURBO_TEAM: vercel

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel in progress if the workflow is a pull request
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24.22.3"
          cache: "pnpm"

      - run: pnpm install
        shell: bash

      - name: Build Monorepo
        run: pnpm run build

      - name: Run tests
        run: pnpm test

      # A release branch publishes under the `latest` dist-tag only while its
      # major is the newest one on npm, so a backport never replaces a newer
      # major as `latest`.
      - name: Choose npm dist-tag
        id: dist-tag
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          branch_major="${GITHUB_REF_NAME%.x}"
          latest="$(npm view @vercel/sandbox dist-tags.latest)"
          latest_major="${latest%%.*}"
          for major in "$branch_major" "$latest_major"; do
            case "$major" in
              "" | *[!0-9]*)
                echo "::error::Cannot compare majors: branch ${GITHUB_REF_NAME}, npm latest '${latest}'"
                exit 1
                ;;
            esac
          done
          if [ "$branch_major" -lt "$latest_major" ]; then
            echo "args=--tag release-${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Create Release Pull Request
        uses: changesets/action@v1
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: pnpm version:prepare
          publish: pnpm release ${{ steps.dist-tag.outputs.args }}
          title: ${{ github.ref == 'refs/heads/main' && 'Version Packages' || format('Version Packages ({0})', github.ref_name) }}
          commit: ${{ github.ref == 'refs/heads/main' && 'Version Packages' || format('Version Packages ({0})', github.ref_name) }}
          commitMode: github-api

  release:
    name: Release
    needs: 
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo "Done"
