name: Images

on:
  push:
    branches:
      - main
    paths:
      - images/**
      - .github/workflows/images.yml
  pull_request:
    paths:
      - images/**
      - .github/workflows/images.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  VCR_TEAM_SLUG: vercel
  VCR_PROJECT_SLUG: sandbox
  VERCEL_CLI_VERSION: 58.4.4

jobs:
  build:
    name: Build
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build images
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: ./images
          provenance: false

  publish:
    name: Build and publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: vcr-publish
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Validate VCR configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::The VERCEL_TOKEN secret must be configured on the vcr-publish environment."
            exit 1
          fi

      - name: Log in to Vercel Container Registry (OIDC)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes "vercel@${VERCEL_CLI_VERSION}" vcr login docker \
            --project "$VCR_PROJECT_SLUG" \
            --scope "$VCR_TEAM_SLUG" \
            --token "$VERCEL_TOKEN"

      - name: Build and push images
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: ./images
          provenance: false
          set: |
            *.output=type=image,push=true,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true
