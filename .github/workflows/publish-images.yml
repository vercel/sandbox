name: Publish Images to VCR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - images/**
      - .github/workflows/publish-images.yml

permissions:
  contents: read

concurrency:
  group: publish-images-vcr
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.images.outputs.builds }}
      images: ${{ steps.images.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Find publishable Bake targets and their platforms
        id: images
        working-directory: images
        run: |
          bake=$(docker buildx bake --print)
          builds=$(jq -c '
            [.target | to_entries[] | select(.value.tags | length > 0)
              | .key as $target
              | (.value.tags[0] | sub(":[^:]+$"; "")) as $repository
              | .value.platforms[]
              | {
                  target: $target,
                  repository: $repository,
                  platform: .,
                  arch: sub("linux/"; ""),
                  runner: (if . == "linux/arm64" then "ubuntu-24.04-arm" else "ubuntu-latest" end)
                }]
          ' <<< "$bake")
          images=$(jq -c '
            [.target | to_entries[] | select(.value.tags | length > 0)
              | {target: .key, tags: (.value.tags | join(",")), platforms: (.value.platforms | length)}]
          ' <<< "$bake")
          echo "builds=$builds" >> "$GITHUB_OUTPUT"
          echo "images=$images" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }} (${{ matrix.platform }})
    if: github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.builds) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to VCR with OIDC
        uses: vercel/vcr-action/login@v1
        with:
          team: ${{ vars.VERCEL_TEAM_ID }}

      - name: Build and push the image by digest
        id: bake
        uses: docker/bake-action@v7
        with:
          source: images
          targets: ${{ matrix.target }}
          vars: |
            PUSH=true
            PUSH_BY_DIGEST=true
          set: |
            *.platform=${{ matrix.platform }}
            ${{ matrix.target }}.tags=${{ matrix.repository }}

      - name: Wait for image optimization
        id: optimized
        uses: vercel/vcr-action/wait-for-optimized-image@v1
        timeout-minutes: 11
        with:
          image: ${{ matrix.repository }}@${{ fromJSON(steps.bake.outputs.metadata)[matrix.target]['containerimage.digest'] }}
          timeout-seconds: 600

      - name: Record the optimized digest
        env:
          DIGEST: ${{ steps.optimized.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.target }}
    if: ${{ !cancelled() && needs.prepare.result == 'success' && github.ref == 'refs/heads/main' }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.images) }}
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.target }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to VCR with OIDC
        uses: vercel/vcr-action/login@v1
        with:
          team: ${{ vars.VERCEL_TEAM_ID }}

      - name: Point the final tags at the optimized images
        env:
          TARGET: ${{ matrix.target }}
          TAGS: ${{ matrix.tags }}
          PLATFORMS: ${{ matrix.platforms }}
        run: |
          IFS=, read -r -a tags <<< "$TAGS"
          repository="${tags[0]%:*}"

          sources=()
          shopt -s nullglob
          for digest in "$RUNNER_TEMP"/digests/*; do
            sources+=("$repository@sha256:$(basename "$digest")")
          done
          if [ "${#sources[@]}" -ne "$PLATFORMS" ]; then
            echo "::error::Expected $PLATFORMS optimized images for $TARGET, found ${#sources[@]}. Its tags are unchanged."
            exit 1
          fi

          docker buildx imagetools create --prefer-index=false \
            "${tags[@]/#/--tag=}" \
            "${sources[@]}"
