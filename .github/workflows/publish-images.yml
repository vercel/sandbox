name: Publish Images to VCR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - images/**
      - .github/workflows/publish-images.yml

permissions:
  contents: read

concurrency:
  group: publish-images-vcr
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.images }}
      builds: ${{ steps.images.outputs.builds }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Find publishable Bake targets
        id: images
        working-directory: images
        run: |
          images=$(docker buildx bake --print | jq -c '
            [.target | to_entries[] | select(.value.tags | length > 0) | {
              target: .key,
              repository: (.value.tags[0] | sub(":[^:]+$"; "")),
              tags: .value.tags,
              platforms: .value.platforms
            }]
          ')
          builds=$(jq -c '[.[] | {target, repository, platform: .platforms[]}]' <<< "$images")
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "builds=$builds" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }} (${{ matrix.platform }})
    if: github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.builds) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to VCR with OIDC
        uses: vercel/vcr-action/login@v1
        with:
          team: ${{ vars.VERCEL_TEAM_ID }}

      - name: Build and push by digest
        id: bake
        uses: docker/bake-action@v7
        with:
          source: images
          targets: ${{ matrix.target }}
          vars: |
            PUSH=true
            PUSH_BY_DIGEST=true
          set: |
            *.platform=${{ matrix.platform }}
            ${{ matrix.target }}.tags=${{ matrix.repository }}

      - name: Wait for image optimization
        id: optimized
        uses: vercel/vcr-action/wait-for-optimized-image@v1
        timeout-minutes: 11
        with:
          image: ${{ matrix.repository }}@${{ fromJSON(steps.bake.outputs.metadata)[matrix.target]['containerimage.digest'] }}
          timeout-seconds: 600

      - name: Record the optimized digest
        env:
          DIGEST: ${{ steps.optimized.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.target }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.target }}
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.images) }}
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.target }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to VCR with OIDC
        uses: vercel/vcr-action/login@v1
        with:
          team: ${{ vars.VERCEL_TEAM_ID }}

      - name: Point the final tags at the optimized images
        env:
          REPOSITORY: ${{ matrix.repository }}
          TAGS: ${{ join(matrix.tags, ' ') }}
          PLATFORMS: ${{ join(matrix.platforms, ' ') }}
        run: |
          read -r -a tags <<< "$TAGS"
          read -r -a platforms <<< "$PLATFORMS"
          shopt -s nullglob
          files=("$RUNNER_TEMP"/digests/*)
          digests=("${files[@]##*/}")
          if [ "${#digests[@]}" -ne "${#platforms[@]}" ]; then
            echo "::error::Expected an optimized image for each of ${platforms[*]}, found ${#digests[@]}."
            exit 1
          fi
          docker buildx imagetools create --prefer-index=false \
            "${tags[@]/#/--tag=}" \
            "${digests[@]/#/$REPOSITORY@sha256:}"
