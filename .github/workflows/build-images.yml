name: Build Images

on:
  pull_request:
    paths:
      - images/**
      - .github/workflows/build-images.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate matrix
        id: generate
        uses: docker/bake-action/subaction/matrix@v7
        with:
          workdir: images
          target: default
          fields: platforms

  images:
    name: Build ${{ matrix.target }} (${{ matrix.platforms }})
    runs-on: ${{ matrix.platforms == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Images
        uses: docker/bake-action@v7
        with:
          source: images
          targets: ${{ matrix.target }}
          push: false
          vars: PUSH=false
          set: |
            *.platform=${{ matrix.platforms }}
